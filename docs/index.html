<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet" type="text/css">
    <title>DDoS시뮬레이션</title>
</head>
<body>
    <div id="normalButton">
        <button id="MoveToDashboard" type="submit" onClick="location.href='Dashboard.html'">서버 상황 확인하기</button>
    </div>

    <form id="request">
        <div id="discription">
            서버에 요청 보낼 아이피
            <div class="input-line">
                <input class="box" type="text" id="ipv4" name="ipv4" placeholder="xxx.xxx.xxx.xxx"/>
            </div>
            
            <br>

            서버에 요청 보낼 횟수  
            <div class="input-line">
                <input class="box" type="number" id="count" min="0" max="99" oninput="limitRange(this)">
            </div>

            <br>
            
            <div class="input-line">
                <input type="submit">
            </div>
        </div>
    </form>
    <script src="https://unpkg.com/inputmask/dist/inputmask.min.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
