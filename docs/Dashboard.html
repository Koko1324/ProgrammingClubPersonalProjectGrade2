<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet" type="text/css">
    <title>Dashboard</title>
</head>
<body>
    <h1>서버 현황 데시보드</h1>

    <div class="container">
        <div>
            <h3>IP별 요청량</h3>
            <pre id="ipStates"></pre><!--JSON 구조 그대로 보여주기 좋음-->
        </div>
        <div>
            <h3>차단된 IP 목록</h3>
            <ul id="blockedIps"></ul><!--목록 데이터에 최적-->
        </div>
        <div>
            <h3>위험 알림</h3>
            <ul id="alerts"></ul>
        </div>
        <div>
            <h3>실시간 초당 요청 수 그래프(RPS)</h3>
            <canvas id="rpsChart" width="600" height="300"></canvas><!--나중에 그래프 확장 가능-->
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/Dashboard.js"></script>
</body>
</html>
